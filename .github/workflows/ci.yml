name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge deps
        run: forge install
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Build (reactive profile)
        run: FOUNDRY_PROFILE=reactive forge build
      - name: Test
        run: forge test -vvv

  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Context imports resolve
        run: ./scripts/check-context.sh

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r build
